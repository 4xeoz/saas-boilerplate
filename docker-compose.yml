services:
  db:
    # Supabase's Postgres image is wire-compatible with Prisma and keeps the
    # local database self-hosted. Use the Supabase CLI for the full local stack.
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "54322:5432"
    volumes:
      - northstar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  northstar_postgres:
