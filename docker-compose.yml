services:
  db:
    # Supabase's Postgres image is wire-compatible with Prisma and keeps the
    # local database self-hosted. Use the Supabase CLI for the full local stack.
    image: supabase/postgres:15.19.0.003
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Bound to localhost so the dev database is not reachable from your network.
      - "127.0.0.1:54322:5432"
    volumes:
      - app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_postgres:
